name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Quality
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          version: 12.11.2
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Markdown link browser interactions
        run: pnpm test
      - name: Lossless Markdown and resource ownership regressions
        run: |
          node tests/lossless/browser.mjs
          node tests/lifecycle/ownership.mjs
          node tests/workspace/delete-open-files.mjs
          node tests/recovery/browser.mjs
          node tests/phase042/bold-input.mjs
          node tests/phase042/link-input.mjs
          node tests/phase042/inline-source-recovery.mjs
          node tests/phase042/inline-formatting-edit.mjs
          node tests/dev/instance-isolation.mjs

  # Rust quality
  rust:
    name: Rust Quality
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Rust cargo check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust file safety and codec tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib

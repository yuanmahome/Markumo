[package]
name = "markumo"
version = "1.0.9"
description = "Lightweight text and Markdown editor"
license = "AGPL-3.0-only"
authors = ["Markumo Team"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "markumo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
encoding_rs = "0.8"
sha2 = "0.10"
tempfile = "3"
regex = "1"
ignore = "0.4"
notify = "8.2"
url = "2"
getrandom = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = { version = "4.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_System_DataExchange"] }
webview2-com = "0.39.1"
windows-core = "0.62.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs"] }
